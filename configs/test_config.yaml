# Model Architecture
model:
  use_concat: True
  max_seq_length: 95
  max_nmr_length: 190
  max_memory_length: 32
  embed_dim: 512
  num_heads: 4
  num_layers: 8
  dropout: 0.0
  resample_size: 1000
  use_stablemax: True
  ir_encoder_type: convnext #regular, convnext
  loop_range: [0, 10]

# Training Parameters
training:
  precision: "fp32"  # Controls training precision (fp32, fp16, bf16)
  batch_size: 32
  test_batch_size: 1
  num_epochs: 10
  learning_rate: 1.0e-4  # This will be used for AdamW components
  min_learning_rate: 1.0e-5
  weight_decay: 0.1
  validation_frequency: 100
  logging_frequency: 10
  save_frequency: 1000
  save_model_frequency: 1000 # How often to save model to wandb (in steps)
  greedy_decode_frequency: 500

# Optimizer Configuration
optimizer:
  type: muon_mix  # Use Muon for matrices and AdamW for vectors/scalars
  adamw:  # Settings for vector parameters (< 2D)
    betas: [0.9, 0.999]
    eps: 1.0e-8
    weight_decay: 0.1
    caution: false
  muon:  # Settings for matrix parameters (≥ 2D)
    lr: 1.0e-3
    momentum: 0.95
    nesterov: true
    ns_steps: 5

# Scheduler
scheduler:
  type: cosine
  warmup_steps: 100


# Data
data:
  use_parquet: False
  data_dir: "data_extraction/multimodal_spectroscopic_dataset"
  binary_dir: "preprocessed_binaries"
  test_size: 20
  val_size: 0.001
  preprocessed: False
  ir_as_prompt: False
  ir_tokenizer_path: "tokenized_baseline/ir_processed/ir_vocab.json"

# Logging
wandb:
  project: "smiles-generation"
  base_run_name: "muon_mix"  # Changed to reflect the optimizer being used
  log_examples: true 