model:
  max_seq_length: 128
  max_nmr_length: 256
  max_memory_length: 128
  embed_dim: 128
  num_heads: 4
  num_layers: 2
  dropout: 0.0
  ir_encoder_type: regular
  ir_as_prompt: false
  use_stablemax: false
  use_rmsnorm: false

training:
  batch_size: 8
  test_batch_size: 8
  num_epochs: 1
  learning_rate: 3.0e-4
  weight_decay: 0.0
  num_workers: 0
  log_every_steps: 20
  seed: 0
  device: mps

data:
  tokenized_dir: data/tokenized_full_candidate_resample1000/data
  pretokenize: true
  preload_ir: false
  use_disk_cache: true
  write_disk_cache: true
  cache_dir: data/tokenized_full_candidate_resample1000/cache
  ir_cache_mode: none
  ir_cache_dtype: float32

diffusion:
  architecture: cross_attention
  mask_prob_floor: 1.0e-3
  mask_prob_ceiling: 1.0
  sampling_steps: 127
  sampling_block_length: 127
  sampling_temperature: 0.0
  sampling_remasking: low_confidence
  cfg_scale: 0.0
  condition_dropout_prob: 0.0
  decode_validate_examples: 0

checkpoint:
  output_dir: checkpoints_test_diffusion
  save_every_epoch: false
